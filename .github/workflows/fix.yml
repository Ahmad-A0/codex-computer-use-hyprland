name: fix
# An agent fixes a breakage reported in an issue, testing in the same VM as CI
# (./test) as it works. Its branch is then tested from scratch; if that passes it
# is merged and released, otherwise the maintainer is mentioned on the issue.
on:
  workflow_call:
    inputs:
      issue: { type: string, required: true }
      failed_run: { type: string, required: false }
  workflow_dispatch:
    inputs:
      issue: { description: Issue describing the breakage, required: true }
      failed_run: { description: Run ID whose artifacts show the failure (optional), required: false }
concurrency:
  group: fix-${{ inputs.issue }}
  cancel-in-progress: false
permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: write
jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    outputs:
      pr: ${{ steps.result.outputs.pr }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: ./.github/actions/e2e-vm-host
      - if: inputs.failed_run != ''
        run: gh run download "${{ inputs.failed_run }}" --dir failed-run || true
        env: { GH_TOKEN: '${{ github.token }}' }
      - id: agent
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          claude_args: --model claude-opus-5-5 --max-turns 1000 --allowedTools "Bash,Read,Edit,Write,Glob,Grep"
          # Headless: nothing resumes the agent, so suite runs must be foreground calls.
          settings: |
            {"env": {"BASH_MAX_TIMEOUT_MS": "7200000", "BASH_DEFAULT_TIMEOUT_MS": "7200000",
                     "CLAUDE_CODE_DISABLE_BACKGROUND_TASKS": "1"}}
          prompt: |
            You maintain this repository, a Hyprland provider for OpenAI's Codex computer use.
            The goal: it works with the latest Codex and Hyprland releases. Read AGENTS.md and
            docs/DESIGN.md first.

            Issue #${{ inputs.issue }} (`gh issue view ${{ inputs.issue }} --comments`) reports a
            failure. The failing run's artifacts, if any, are in ./failed-run (report.html has
            screenshots and accessibility trees). If an open pull request from branch
            fix/issue-${{ inputs.issue }} exists, continue from it.

            `./test` boots the same disposable Arch VM as CI with the latest packages and runs
            the end-to-end suite (`E2E_ONLY=<regex>` for a subset). Use it as often as you need;
            run everything in the foreground, since nothing resumes you once you stop.
            Fix the root cause. Change a test only when upstream deliberately changed the
            behaviour it checks, and say why in the pull request.

            When the full `./test` passes, push branch fix/issue-${{ inputs.issue }} and open (or
            update) a pull request saying what broke and why, with "Fixes #${{ inputs.issue }}".
            CI then reruns the suite on it and merges it if green. If you can't fix it, comment
            your findings on the issue instead. Don't push to main or change .github/.
      - if: always() && steps.agent.outputs.execution_file != ''
        uses: actions/upload-artifact@v4
        with: { name: fix-agent-transcript, path: '${{ steps.agent.outputs.execution_file }}' }
      - id: result
        if: always()
        run: echo "pr=$(gh pr list --head fix/issue-${{ inputs.issue }} --state open --json number --jq '.[0].number // ""')" >> "$GITHUB_OUTPUT"
        env: { GH_TOKEN: '${{ github.token }}', GH_REPO: '${{ github.repository }}' }

  # The agent's own runs aren't the gate: test its branch from scratch.
  e2e:
    needs: fix
    if: always() && needs.fix.outputs.pr != ''
    permissions: { contents: read, actions: read }
    uses: ./.github/workflows/e2e.yml
    with: { ref: 'fix/issue-${{ inputs.issue }}' }
    secrets: inherit

  # A merge by the workflow token triggers no push workflows, so release here.
  merge:
    needs: [fix, e2e]
    if: always() && needs.e2e.result == 'success'
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.merge.outputs.sha }}
    steps:
      - id: merge
        run: |
          gh pr merge "$PR" --squash --delete-branch
          echo "sha=$(gh pr view "$PR" --json mergeCommit --jq .mergeCommit.oid)" >> "$GITHUB_OUTPUT"
          gh issue close "$ISSUE" --comment "Fixed by #$PR." || true
        env: { GH_TOKEN: '${{ github.token }}', GH_REPO: '${{ github.repository }}', PR: '${{ needs.fix.outputs.pr }}', ISSUE: '${{ inputs.issue }}' }

  release:
    needs: [merge, e2e]
    if: always() && needs.merge.outputs.sha != ''
    permissions: { contents: write }
    uses: ./.github/workflows/release.yml
    with:
      sha: ${{ needs.merge.outputs.sha }}
      run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      versions: ${{ needs.e2e.outputs.versions }}
    secrets: inherit

  stuck:
    needs: [fix, e2e, merge]
    if: always() && needs.merge.result != 'success'
    runs-on: ubuntu-latest
    steps:
      - run: |
          gh issue comment "$ISSUE" --body "@$OWNER the automatic fix didn't get through (pull request ${PR:-none}, its e2e run ${E2E}). Run: $RUN"
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ISSUE: ${{ inputs.issue }}
          OWNER: ${{ github.repository_owner }}
          PR: ${{ needs.fix.outputs.pr && format('#{0}', needs.fix.outputs.pr) || '' }}
          E2E: ${{ needs.e2e.result }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
