name: draft-release
# After the end-to-end suite passes on main, keep one draft release up to date:
# next version, changes since the last release, and the upstream versions it was
# tested with. Publishing the draft (a human decision) triggers release.yml.
on:
  workflow_run:
    workflows: [e2e]
    types: [completed]
    branches: [main]
concurrency:
  group: draft-release
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  draft:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
      - run: scripts/release/draft.sh "${{ github.event.workflow_run.head_sha }}" "${{ github.event.workflow_run.html_url }}"
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
