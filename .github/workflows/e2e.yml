name: e2e
# Runs ./test: a disposable Arch Linux + Hyprland VM, installed as a user would.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      only:
        description: Test name regex (E2E_ONLY)
        required: false
      hyprland:
        description: release (Arch's package) or git (Hyprland main built from source)
        type: choice
        options: [release, git]
        default: release
  workflow_call:
    inputs:
      only:
        type: string
        required: false
      ref:
        description: Commit or branch to test (default is the triggering commit)
        type: string
        required: false
      hyprland:
        description: release (Arch's package) or git (Hyprland main built from source)
        type: string
        required: false
        default: release
    outputs:
      versions:
        description: Versions installed in the guest (chatgpt-bin, hyprland, @oai/cua, @oai/sky), as JSON
        value: ${{ jobs.vm.outputs.versions }}
concurrency:
  group: e2e-${{ github.workflow }}-${{ github.ref }}-${{ inputs.ref }}-${{ inputs.hyprland }}
  cancel-in-progress: true
jobs:
  vm:
    runs-on: ubuntu-latest
    # git compiles Hyprland (and any hyprwm libraries it needs) while provisioning.
    timeout-minutes: ${{ inputs.hyprland == 'git' && 100 || 40 }}
    # Job-wide, so the host action's cache keys are those of the variant ./test builds.
    env:
      E2E_HYPRLAND: ${{ inputs.hyprland || 'release' }}
    outputs:
      versions: ${{ steps.versions.outputs.json }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: ./.github/actions/e2e-vm-host
      - run: ./test
        env:
          E2E_ONLY: ${{ inputs.only }}
      - uses: ./.github/actions/e2e-vm-host
        if: always()
        with:
          save: 'true'
      - id: versions
        if: always()
        run: echo "json=$(cat e2e-artifacts/versions.json 2>/dev/null || echo '{}')" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: e2e-artifacts
          path: e2e-artifacts
          if-no-files-found: ignore
