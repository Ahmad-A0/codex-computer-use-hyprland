name: e2e
# Runs ./test: a disposable Arch Linux + Hyprland VM, installed as a user would.
on:
  push:
    branches: [main, e2e-vm]  # TEMP
  pull_request:
  workflow_dispatch:
    inputs:
      only:
        description: Test name regex (E2E_ONLY)
        required: false
  workflow_call:
    inputs:
      only:
        type: string
        required: false
concurrency:
  group: e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  vm:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: Enable KVM and install QEMU
        id: setup
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
          sudo apt-get install -y -qq --no-install-recommends qemu-system-x86 qemu-utils xorriso >/dev/null
          echo "sha=$(curl -fsSL --retry 3 https://geo.mirror.pkgbuild.com/images/latest/Arch-Linux-x86_64-cloudimg.qcow2.SHA256 | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
          echo "day=$(date -u +%F)" >> "$GITHUB_OUTPUT"
      # The provisioned disk (tests/e2e/vm/run.sh rebuilds it daily); the base
      # image is needed only to rebuild it. Saved even when tests fail.
      - uses: actions/cache/restore@v6
        id: ready
        with:
          path: ~/.cache/codex-hyprland-e2e/ready
          key: e2e-ready-${{ steps.setup.outputs.day }}-${{ hashFiles('tests/e2e/vm/provision.sh', 'tests/e2e/vm/hyprland.lua', 'tests/e2e/vm/openai-chatgpt.gpg') }}-${{ steps.setup.outputs.sha }}
      - uses: actions/cache/restore@v6
        id: base
        if: steps.ready.outputs.cache-hit != 'true'
        with:
          path: ~/.cache/codex-hyprland-e2e/base
          key: e2e-base-${{ steps.setup.outputs.sha }}
      - run: ./test
        env:
          E2E_ONLY: ${{ inputs.only }}
      - uses: actions/cache/save@v6
        if: always() && steps.ready.outputs.cache-hit != 'true'
        with:
          path: ~/.cache/codex-hyprland-e2e/ready
          key: ${{ steps.ready.outputs.cache-primary-key }}
      - uses: actions/cache/save@v6
        if: always() && steps.ready.outputs.cache-hit != 'true' && steps.base.outputs.cache-hit != 'true'
        with:
          path: ~/.cache/codex-hyprland-e2e/base
          key: e2e-base-${{ steps.setup.outputs.sha }}
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: e2e-artifacts
          path: e2e-artifacts
          if-no-files-found: ignore
