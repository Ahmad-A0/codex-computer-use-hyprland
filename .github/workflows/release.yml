name: release
# When the end-to-end suite passes on a push to main and something users
# install changed since the last release, publish the next patch release with a
# source tarball and an AUR PKGBUILD built and checked in an Arch container.
# fix.yml calls this after merging a verified fix, since its merge (with the
# workflow token) triggers no push workflows. Pushing to the AUR is off until
# the AUR_PUBLISH variable is "true" and the AUR_SSH_PRIVATE_KEY secret exists.
on:
  workflow_run:
    workflows: [e2e]
    types: [completed]
    branches: [main]
  workflow_call:
    inputs:
      sha:
        description: Commit on main that passed the end-to-end suite
        type: string
        required: true
      run:
        description: URL of the passing end-to-end run
        type: string
        required: true
      versions:
        description: Upstream versions the run tested (JSON), for the release notes
        type: string
        required: false
    outputs:
      tag:
        description: The published tag, or empty when nothing users install changed
        value: ${{ jobs.publish.outputs.tag }}
concurrency:
  group: release
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  publish:
    if: inputs.sha != '' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.publish.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sha || github.event.workflow_run.head_sha }}
          fetch-depth: 0
      - id: publish
        run: |
          # Only the newest tested main is released; a later push gets its own run.
          head=$(git ls-remote origin refs/heads/main | cut -f1)
          if [ "$head" != "$SHA" ]; then echo "main has moved on to $head; skipping $SHA"; exit 0; fi
          tag=$(scripts/release/publish.sh "$SHA" "$RUN")
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          [ -z "$tag" ] || echo "Published $tag"
        env:
          SHA: ${{ inputs.sha || github.event.workflow_run.head_sha }}
          RUN: ${{ inputs.run || github.event.workflow_run.html_url }}
          VERSIONS: ${{ inputs.versions }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}

  package:
    needs: publish
    if: needs.publish.outputs.tag != ''
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - run: pacman -Syu --noconfirm --needed base-devel git github-cli namcap
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.publish.outputs.tag }}
      - name: Source tarball, PKGBUILD and .SRCINFO
        run: |
          git config --global --add safe.directory "$PWD"
          version=${TAG#v}
          name=codex-computer-use-hyprland
          git archive --prefix="$name-$version/" -o "$name-$version.tar.gz" "$TAG"
          url="$SERVER/$REPO/releases/download/$TAG/$name-$version.tar.gz"
          scripts/release/pkgbuild.sh "$version" "$url" "$(sha256sum "$name-$version.tar.gz" | cut -d' ' -f1)" > PKGBUILD
          cp packaging/aur/*.install . 2>/dev/null || true
          # makepkg refuses root; build as an unprivileged user from the local tarball.
          useradd -m builder && chown -R builder .
          su builder -c "makepkg --printsrcinfo > .SRCINFO && makepkg --nodeps --nobuild --skipinteg"
          namcap PKGBUILD || true
          # GitHub renames dot-file assets ("default.SRCINFO"); name it plainly.
          cp .SRCINFO SRCINFO
          gh release upload "$TAG" "$name-$version.tar.gz" PKGBUILD SRCINFO --clobber
        env:
          TAG: ${{ needs.publish.outputs.tag }}
          SERVER: ${{ github.server_url }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
      - uses: actions/upload-artifact@v4
        with:
          name: aur
          path: |
            PKGBUILD
            .SRCINFO
            *.install

  aur:
    needs: [publish, package]
    if: vars.AUR_PUBLISH == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: aur
          path: aur
      - run: |
          test -n "$KEY" || { echo 'AUR_SSH_PRIVATE_KEY is not set'; exit 1; }
          mkdir -p ~/.ssh && printf '%s\n' "$KEY" > ~/.ssh/aur && chmod 600 ~/.ssh/aur
          ssh-keyscan aur.archlinux.org >> ~/.ssh/known_hosts
          export GIT_SSH_COMMAND='ssh -i ~/.ssh/aur'
          git clone "ssh://aur@aur.archlinux.org/$PKG.git" pkg
          cp aur/PKGBUILD aur/.SRCINFO pkg/ && cp aur/*.install pkg/ 2>/dev/null || true
          cd pkg && git add -A && git -c user.name="$NAME" -c user.email="$EMAIL" commit -m "Update to ${TAG#v}" && git push
        env:
          KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          PKG: ${{ vars.AUR_PACKAGE || 'codex-computer-use-hyprland' }}
          NAME: ${{ vars.AUR_COMMIT_NAME || 'github-actions' }}
          EMAIL: ${{ vars.AUR_COMMIT_EMAIL || 'github-actions@users.noreply.github.com' }}
          TAG: ${{ needs.publish.outputs.tag }}
