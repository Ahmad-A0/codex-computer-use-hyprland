<!doctype html><meta charset="utf-8"><title>Codex browser parity fixture</title>
<style>body{font:18px sans-serif;padding:24px}#editor{border:2px solid #668;padding:12px;min-height:140px}textarea{width:95%;height:140px}.box{display:inline-block;padding:30px;margin:20px;background:#dde}#drop{background:#cfc}</style>
<h1>Browser parity fixture</h1>
<label>Editable document</label><div id="editor" role="textbox" aria-label="Rich editor" contenteditable="true">Initial editable text</div>
<label>Paste report<textarea id="report" readonly aria-label="Paste report"></textarea></label>
<div draggable="true" id="source" class="box">Drag source</div><div id="drop" class="box">Drop destination</div>
<output id="dropReport" aria-label="Drop report">No drop</output>
<script>
editor.addEventListener('paste',event=>{const html=event.clipboardData.getData('text/html'),text=event.clipboardData.getData('text/plain');setTimeout(()=>{report.value=JSON.stringify({html,text,actual:editor.innerHTML});},50)});
source.addEventListener('dragstart',event=>event.dataTransfer.setData('text/plain','native-drag-payload'));
drop.addEventListener('dragover',event=>event.preventDefault());
drop.addEventListener('drop',event=>{event.preventDefault();dropReport.textContent=event.dataTransfer.getData('text/plain')});
</script>
