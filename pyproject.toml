[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "codex-computer-use-hyprland"
version = "0.1.0"
description = "Hyprland backend for the unchanged Codex Sky and cua_repl APIs"
requires-python = ">=3.11"
dependencies = ["markdown-it-py==4.2.0"]

[project.scripts]
sky-hyprland = "codex_hyprland.protocol:main"

[tool.setuptools.packages.find]
where = ["src"]
